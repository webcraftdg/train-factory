<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">TrainFactory</title><desc id="desc">Monogramme TF blanc et bleu avec gant de boxe bleu sur fond bleu nuit.</desc>
<defs>
