
<header class="w-full bg-slate-900 text-white">
  <div class="flex h-16 w-full items-center justify-between px-4 sm:px-8 lg:px-12">

    <!-- Logo -->
    <div class="flex items-center gap-3">
      <a
      routerLink="/tableau-de-bord"
      class="flex items-center gap-3"
      aria-label="TrainFactory - Tableau de bord"
    >
      <img
        src="/angular/images/logo.svg"
        alt=""
        class="h-10 w-10 shrink-0 object-contain"
      />

      <span class="text-lg font-bold text-white sm:text-xl">
        TrainFactory
      </span>
    </a>
    </div>

    <!-- Utilisateur connecté -->
    @if (auth.authenticated()) {
      <div class="hidden items-center gap-5 md:flex">
        <a
          routerLink="/seances"
          routerLinkActive="bg-blue-600 text-white shadow-sm"
          class="inline-flex items-center gap-2 rounded-lg
                px-4 py-2.5 text-sm font-semibold
                text-slate-300
                transition-colors duration-200
                hover:bg-slate-700 hover:text-white"
        >
          Séances
        </a>
        <!-- Avatar -->
        <div
          class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-700"
          title="Mon compte"
        >
          <svg xmlns="http://www.w3.org/2000/svg"
               width="22" height="22"
               viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.8"
               stroke-linecap="round"
               stroke-linejoin="round"
               aria-hidden="true">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21a8 8 0 0 1 16 0"/>
          </svg>
        </div>

        <!-- Déconnexion -->
        <button
          type="button"
          (click)="logout()"
          class="rounded-lg border border-slate-600 px-4 py-2 text-sm font-medium text-slate-200 transition hover:border-red-400 hover:bg-red-500/10 hover:text-red-300"
        >
          <span class="hidden sm:inline">Déconnexion</span>
          <span class="sm:hidden">Quitter</span>
        </button>

      </div>
      <button type="button" class="rounded-lg border border-slate-600 p-2 md:hidden"
        aria-label="Menu de navigation" [attr.aria-expanded]="mobileMenuOpen()"
        (click)="mobileMenuOpen.update(value => !value)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    }
  </div>
  @if (auth.authenticated() && mobileMenuOpen()) {
    <nav class="grid gap-1 border-t border-slate-700 p-3 md:hidden" aria-label="Navigation mobile">
      <a routerLink="/tableau-de-bord" (click)="mobileMenuOpen.set(false)" class="rounded-lg px-3 py-3 hover:bg-slate-700">Tableau de bord</a>
      <a routerLink="/seances" routerLinkActive="bg-blue-600" (click)="mobileMenuOpen.set(false)" class="rounded-lg px-3 py-3 hover:bg-slate-700">Séances</a>
      <button type="button" (click)="logout()" class="rounded-lg px-3 py-3 text-left text-slate-200 hover:bg-slate-700">Déconnexion</button>
    </nav>
  }
</header>
