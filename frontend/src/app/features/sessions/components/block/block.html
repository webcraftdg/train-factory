
<section
  [formGroup]="form()"
  class="overflow-hidden rounded-xl border border-slate-300 bg-white shadow-sm"
>
  <!-- En-tête du bloc -->
  <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-800 px-4 py-3 text-white">
    <div class="flex min-w-0 flex-1 items-center gap-3">
      <span class="text-xs font-semibold text-slate-300">
        {{ index() + 1 }}.
      </span>

      <input
        formControlName="name"
        placeholder="Nom de la partie (ex. Échauffement)"
        aria-label="Nom de la partie"
        class="min-w-0 flex-1 border-b border-transparent bg-transparent py-1 font-semibold outline-none placeholder:text-slate-400 focus:border-blue-300"
      />
    </div>

    <button
      type="button"
      (click)="remove.emit()"
      class="rounded-md p-2 text-slate-300 hover:bg-red-600 hover:text-white"
      aria-label="Supprimer cette partie"
      title="Supprimer cette partie"
    >
      Supprimer
    </button>
  </div>

  <!-- Informations du bloc -->
  <div class="grid gap-4 border-b border-slate-200 bg-slate-50 p-4 md:grid-cols-2">
    <div>
      <label class="mb-1 block text-xs font-semibold text-slate-600">
        Description
      </label>
      <textarea
        formControlName="description"
        rows="2"
        placeholder="Description de cette partie..."
        class="w-full resize-y rounded-md border border-slate-300 bg-white p-2 text-sm outline-none focus:border-blue-500"
      ></textarea>
    </div>

    <div class="space-y-3">
      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-600">
          Objectif
        </label>
        <input
          formControlName="objective"
          class="w-full rounded-md border border-slate-300 bg-white p-2 text-sm outline-none focus:border-blue-500"
        />
      </div>

      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-600">
          Consigne générale
        </label>
        <input
          formControlName="instruction"
          class="w-full rounded-md border border-slate-300 bg-white p-2 text-sm outline-none focus:border-blue-500"
        />
      </div>
    </div>
  </div>

  <!-- Tableau des activités -->
  <div class="overflow-x-auto">
    <table class="w-full min-w-[760px] border-collapse text-sm">
      <thead class="bg-slate-100 text-slate-700">
        <tr>
          <th class="border border-slate-200 p-3 text-left">Tireur A</th>
          <th class="border border-slate-200 p-3 text-left">Tireur B</th>
          <th class="border border-slate-200 p-3 text-left">Consigne</th>
          <th class="border border-slate-200 p-3 text-left">Objectifs</th>
          <th class="w-28 border border-slate-200 p-3 text-left">Durée</th>
          <th class="w-12 border border-slate-200 p-3"></th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td colspan="6" class="p-8 text-center text-slate-400">
            Aucune activité dans cette partie.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="flex justify-end border-t border-slate-200 bg-white p-3">
    <span class="text-sm text-slate-400">
      Les activités seront ajoutées à l'étape suivante.
    </span>
  </div>
</section>
