
<section
  [formGroup]="form()"
  class="w-full border-x border-t border-slate-500 bg-white"
>
  <!-- Barre supérieure du bloc -->
  <div class="flex min-h-11 items-center gap-4 border-b border-slate-500 bg-slate-200 px-3">
    <label class="flex min-w-0 flex-1 items-center gap-4">
      <span class="shrink-0 text-xs font-bold text-slate-800">
        Partie de séance
      </span>

      <input
        formControlName="name"
        aria-label="Nom de la partie de séance"
        class="min-w-0 flex-1 bg-transparent py-2 font-bold text-slate-900 outline-none"
      />
    </label>

    <button
      type="button"
      (click)="collapsed.set(!collapsed())"
      class="shrink-0 text-sm font-semibold text-blue-700"
    >
      {{ collapsed() ? '▸ Déplier' : '▾ Replier' }}
    </button>

    <button
      type="button"
      (click)="remove.emit()"
      class="px-2 text-xl font-bold text-red-600"
      aria-label="Supprimer la partie"
    >
      ×
    </button>
  </div>

  @if (!collapsed()) {
    <!-- Description à gauche, tableau à droite -->
    <div class="grid grid-cols-1 md:grid-cols-[18%_82%]">

      <!-- Description du bloc -->
      <div class="border-b border-slate-400 md:border-r">
        <textarea
          formControlName="description"
          rows="4"
          placeholder="Description du bloc..."
          aria-label="Description du bloc"
          class="h-full min-h-28 w-full resize-y bg-transparent p-3 text-sm outline-none"
        ></textarea>
      </div>

      <!-- Partie droite -->
      <div class="min-w-0">
        <div class="overflow-x-auto">
          <table class="w-full min-w-[700px] table-fixed border-collapse text-sm">

            <colgroup>
              <col style="width: 22%" />
              <col style="width: 22%" />
              <col style="width: 24%" />
              <col style="width: 22%" />
              <col style="width: 10%" />
            </colgroup>

            <thead>
              <tr class="bg-slate-100 text-slate-800">
                <th class="border-b border-r border-slate-400 p-3">
                  Exercice 1
                </th>
                <th class="border-b border-r border-slate-400 p-3">
                  Exercice 2
                </th>
                <th class="border-b border-r border-slate-400 p-3">
                  Consigne
                </th>
                <th class="border-b border-r border-slate-400 p-3">
                  Objectif
                </th>
                <th class="border-b border-slate-400 p-2">
                  Durée
                </th>
              </tr>
            </thead>

            <tbody>
                @for (activity of activities.controls; track activity; let i = $index) {
                    <tr
                      app-activity
                      [form]="activity"
                      (remove)="removeActivity(i)"
                    ></tr>
                  }
            </tbody>
          </table>
        </div>

        <!-- Barre inférieure du bloc -->
        <div class="flex flex-wrap items-center justify-between gap-3 border-t border-slate-400 bg-slate-50 p-2">

          <button
            type="button"
            (click)="addActivity()"
            class="rounded-md border border-dashed border-blue-400 bg-blue-50 px-4 py-2 text-sm font-semibold text-blue-700 hover:bg-blue-100"
          >
            + Ajouter une ligne de travail
          </button>

          <label class="flex items-center gap-2 text-xs text-slate-800">
            <input
              type="checkbox"
              [checked]="separator()"
              (change)="toggleSeparator()"
            />
            Séparation renforcée après cette partie
          </label>
        </div>
      </div>
    </div>
  }
</section>
